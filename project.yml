# XcodeGen spec for the Plateworks Ignition app.
# Regenerate the .xcodeproj with:  xcodegen generate   (XcodeGen 2.38+)
#
# The app target depends on the local PlateworksCore Swift package (Package.swift
# at the repo root), which holds all IRPG table data and calculation logic and
# is independently unit-tested on Linux CI.
name: PlateworksIgnition

# Project-level build settings, applied beneath every target's own settings.
# signing.xcconfig is committed and does one thing: optionally include
# signing.local.xcconfig (git-ignored), where a developer puts their own
# DEVELOPMENT_TEAM for device builds. Missing local file = no team, which is
# what CI and fresh clones want. Do not put a team ID anywhere in this spec —
# a target-level DEVELOPMENT_TEAM would override the xcconfig and break this.
configFiles:
  Debug: signing.xcconfig
  Release: signing.xcconfig

# The single source of truth for the version, inherited by every target.
#
# It has to live here, at project level, because App Store Connect rejects an
# upload whose embedded bundles disagree with their container: bump the app to
# build 2 while the widget and watch stay at 1 and validation fails with
# "CFBundleShortVersionString ... must match the version of its containing
# bundle". Three of the four bundles use a hand-specified Info.plist, and
# XcodeGen fills those with a *literal* "1.0"/"1" unless told otherwise — so
# each one also references $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION)
# explicitly in its `info.properties`. Bump here and everything follows.
#
# CURRENT_PROJECT_VERSION must increase for every upload — App Store Connect
# refuses a build number it has already seen, even for a rejected build.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

options:
  bundleIdPrefix: org.plateworks
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PlateworksCore:
    path: .

targets:
  PlateworksIgnition:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/PlateworksIgnition
      # Compiled into the app *and* into the widget extension, so the two
      # processes share one definition of the App Group container and the
      # record's filenames rather than each keeping a private copy that can
      # drift. See App/Shared/RecordLocation.swift.
      - path: App/Shared
    dependencies:
      - package: PlateworksCore
        product: PlateworksCore
      # Embedded so the widget ships inside the app. iOS only: the extension has
      # no macOS destination, and embedding it unconditionally would break the
      # macOS build that keeps the canImport(AppKit) branches honest.
      - target: PlateworksWidget
        embed: true
        platformFilter: iOS
      # The watch app ships inside the iOS app. Same iOS-only filter: there is
      # no macOS destination that embeds watch content.
      - target: PlateworksWatch
        embed: true
        platformFilter: iOS
    entitlements:
      path: App/PlateworksIgnition/PlateworksIgnition.entitlements
      properties:
        # The observation record lives in this group container so a widget
        # extension (a separate process) can read it without the record having to
        # be migrated a second time. See ObservationRecordStore.
        com.apple.security.application-groups:
          - group.org.plateworks.ignition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.plateworks.ignition
        # PRODUCT_NAME deliberately has NO space and matches the target name.
        # It names the binary and the .app bundle, and XcodeGen derives the unit
        # test target's TEST_HOST from the *target* name — so a spaced
        # PRODUCT_NAME ("Plateworks Ignition") pointed TEST_HOST at
        # PlateworksIgnition.app/PlateworksIgnition while the build actually produced
        # "Plateworks Ignition.app/Plateworks Ignition". PlateworksIgnitionTests could
        # never launch as a result. The user-visible home-screen name comes from
        # INFOPLIST_KEY_CFBundleDisplayName below, which is what it is for.
        #
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION are inherited from the
        # project-level settings block — see the note there before adding them
        # back to any target.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plateworks Ignition
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # The obs-cadence countdown on the lock screen and in the Dynamic
        # Island. Without this key Activity.request fails silently at runtime
        # and the countdown simply never appears. It carries no computed value —
        # see App/Shared/ObsActivityAttributes.swift.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Required for the one-shot site GPS fix (SiteLocationProvider). Without
        # this key the authorization request is ignored and the fix never
        # arrives. When-in-use only: the app takes a single fix on demand and
        # never tracks, so there is no "always" mode to justify.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Fills the observation site's coordinate and elevation from a single GPS
          fix so they don't have to be typed on the line. The position stays on
          this device — it is only written to the observation log and the
          spreadsheets you export.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: PoolTeal
        # Swift 6 language mode: full data-race checking, matching
        # Package.swift's swiftLanguageMode(.v6) for PlateworksCore. The view
        # models and the SwiftUI views are @MainActor-isolated accordingly.
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The signing team comes from signing.local.xcconfig (git-ignored, via
        # the project-level signing.xcconfig) — deliberately NOT set here, and
        # deliberately not passed as an `xcodebuild DEVELOPMENT_TEAM=` override
        # either: a command-line team override breaks -allowProvisioningUpdates'
        # App Group registration (the generated profiles come back with an empty
        # application-groups array and signing fails).
        CODE_SIGN_STYLE: Automatic
        # No non-exempt encryption (no custom crypto; the app makes no network
        # requests at all). Pre-answers App Store Connect's export-compliance
        # question so TestFlight builds don't stall on it.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  # The home-screen and lock-screen glanceable surfaces. A separate process from
  # the app: it reads the shared App Group container through RecordReader and
  # cannot write to it. iOS only — a widget extension has no macOS destination
  # here, and the watch complication is its own target (it cannot reach an App
  # Group and syncs over WatchConnectivity instead).
  PlateworksWidget:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: App/PlateworksWidget
      # RecordLocation (one definition of the container path, shared with the
      # app), PlateworksColor, and PlateworksColors.xcassets — the palette lives in
      # App/Shared precisely so this target gets it. Color(_:) resolves against
      # the *calling* bundle, which for an extension is the extension itself, so
      # the catalog must be compiled in here rather than inherited from the host.
      - path: App/Shared
    dependencies:
      - package: PlateworksCore
        product: PlateworksCore
    entitlements:
      path: App/PlateworksWidget/PlateworksWidget.entitlements
      properties:
        # Must match the app's group exactly. A mismatch here does not error —
        # it presents as "the widget is always empty". See Task 14 in
        # docs/PLAN_WIDGET_AND_WATCH.md.
        com.apple.security.application-groups:
          - group.org.plateworks.ignition
    # A real Info.plist, not GENERATE_INFOPLIST_FILE.
    #
    # The plan specified `INFOPLIST_KEY_NSExtensionPointIdentifier`, but there is
    # no such build setting — the INFOPLIST_KEY_* mechanism covers a fixed set of
    # keys and `NSExtension` is not among them. The generated plist therefore had
    # no NSExtension dictionary at all, which builds and links perfectly happily
    # and then fails at *install* time with "Failed to create app extension
    # placeholder" / "Invalid placeholder attributes" — a message that says
    # nothing about the missing key. An extension point has to be declared in the
    # plist itself.
    info:
      path: App/PlateworksWidget/Info.plist
      properties:
        CFBundleDisplayName: Plateworks Ignition
        # Track the project-level version rather than XcodeGen's literal
        # default, or this bundle freezes at 1.0/1 and fails upload validation
        # the first time the app's build number moves.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.plateworks.ignition.widget
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # The watchOS app: a read-only mirror of the phone's latest logged
  # observation, fed over WatchConnectivity. No App Group with the phone — a
  # group is shared between a host app and its extensions on one device and does
  # not cross the pairing, which is exactly why WCSession exists here.
  PlateworksWatch:
    type: application
    # `platform:`, not `supportedDestinations:` — XcodeGen rejects watchOS in a
    # multiplatform destination list ("Create a separate target using platform").
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # Includes PlateworksWatchAssets.xcassets, which exists only to carry an
      # AppIcon set. A watchOS *application* requires one — actool fails the
      # build with "None of the input catalogs contained a matching ... app icon
      # set named AppIcon" — whereas the extensions don't. Like the iOS app's,
      # it declares the slot and carries no artwork yet.
      - path: App/PlateworksWatch
      # Shared with the complication: the snapshot store both processes read.
      - path: App/WatchShared
      # PlateworksColor + the palette. Deliberately NOT App/PlateworksIgnition's
      # catalog — that one carries an iOS-idiom AppIcon with no business in a
      # watchOS bundle.
      - path: App/Shared/PlateworksColor.swift
      - path: App/Shared/PlateworksColors.xcassets
    dependencies:
      - package: PlateworksCore
        product: PlateworksCore
      - target: PlateworksWatchWidget
        embed: true
    entitlements:
      path: App/PlateworksWatch/PlateworksWatch.entitlements
      properties:
        # The watch pair's own group — a different identifier from the phone's
        # on purpose. The complication is a separate process from the watch app
        # and this container is the only way it sees a snapshot at all.
        com.apple.security.application-groups:
          - group.org.plateworks.ignition.watch
    info:
      path: App/PlateworksWatch/Info.plist
      properties:
        CFBundleDisplayName: Ignition
        # Same reason as the widget's — see that target's note.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # WKApplication marks this as a modern *single-target* watch app. Without
        # it the installer reads the bundle as a legacy WatchKit 2.0 app and
        # refuses the whole containing iOS app:
        #   "Found WatchKit 2.0 app at .../Watch/PlateworksWatch.app but it does
        #    not have a WKWatchKitApp or WKApplication key set to true"
        # Note the blast radius — a missing key in the *watch* plist blocks
        # installation of the phone app, and therefore the phone's UI tests.
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.plateworks.ignition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.plateworks.ignition.watchkitapp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  # The complication. Same glance rule as the phone widget, applied against the
  # watch's own clock.
  PlateworksWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: App/PlateworksWatchWidget
      - path: App/WatchShared
      - path: App/Shared/PlateworksColor.swift
      - path: App/Shared/PlateworksColors.xcassets
    dependencies:
      - package: PlateworksCore
        product: PlateworksCore
    entitlements:
      path: App/PlateworksWatchWidget/PlateworksWatchWidget.entitlements
      properties:
        # Must match PlateworksWatch's exactly, or the complication is always
        # empty — the watch-side twin of the Task 14 trap.
        com.apple.security.application-groups:
          - group.org.plateworks.ignition.watch
    # A real Info.plist for the same reason the phone widget needs one:
    # NSExtension is not settable via INFOPLIST_KEY_*, and an extension with no
    # declared extension point builds fine and fails at install.
    info:
      path: App/PlateworksWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Ignition
        # Same reason as the widget's — see that target's note.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.plateworks.ignition.watchkitapp.widget
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  PlateworksIgnitionTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: App/PlateworksIgnitionTests
    dependencies:
      - target: PlateworksIgnition
      - package: PlateworksCore
        product: PlateworksCore
    entitlements:
      path: App/PlateworksIgnition/PlateworksIgnition.entitlements
      properties:
        # The observation record lives in this group container so a widget
        # extension (a separate process) can read it without the record having to
        # be migrated a second time. See ObservationRecordStore.
        com.apple.security.application-groups:
          - group.org.plateworks.ignition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.plateworks.ignition.unittests
        GENERATE_INFOPLIST_FILE: YES

  PlateworksIgnitionUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: App/PlateworksIgnitionUITests
    dependencies:
      - target: PlateworksIgnition
    entitlements:
      path: App/PlateworksIgnition/PlateworksIgnition.entitlements
      properties:
        # The observation record lives in this group container so a widget
        # extension (a separate process) can read it without the record having to
        # be migrated a second time. See ObservationRecordStore.
        com.apple.security.application-groups:
          - group.org.plateworks.ignition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.plateworks.ignition.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PlateworksIgnition:
    build:
      targets:
        PlateworksIgnition: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlateworksIgnitionTests
        - PlateworksIgnitionUITests

  # Building the app scheme already compiles the embedded extension, but only
  # for as long as the embed wiring holds. This scheme compiles the widget on
  # its own, so a regression in that wiring fails as "the widget didn't build"
  # rather than silently dropping it from CI's coverage — which is exactly how
  # the canImport(AppKit) branches in WatchView rotted for months.
  PlateworksWidget:
    build:
      targets:
        PlateworksWidget: all
    run:
      config: Debug

  # The watch app needs its own scheme and a watchOS simulator: building the iOS
  # app scheme does not compile watch content on a simulator destination, so
  # without this the watchOS sources would sit in the repo uncompiled by
  # anything — the precise way the canImport(AppKit) branches rotted.
  PlateworksWatch:
    build:
      targets:
        PlateworksWatch: all
    run:
      config: Debug
