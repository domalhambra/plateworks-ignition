<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Plateworks Ignition">
  <defs>
    <radialGradient id="ground" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#4FB2BE"/>
      <stop offset="0.55" stop-color="#1D7784"/>
      <stop offset="1" stop-color="#0F3A41"/>
    </radialGradient>
    <linearGradient id="ramp" x1="256" y1="419" x2="256" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8460"/>
      <stop offset="0.26" stop-color="#B3A24A"/>
      <stop offset="0.5" stop-color="#CE9636"/>
      <stop offset="0.7" stop-color="#D9823C"/>
      <stop offset="0.86" stop-color="#DD6A30"/>
      <stop offset="1" stop-color="#D6402A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ground)"/>
  <!-- One flame: pinched base, belly, one smooth deep waist, flicked tip. The
       gradient runs bottom-to-top through PlateworksCore.FireBehavior's own
       severity ramp (Very Low green through Extreme red) — the icon literally
       renders in the app's own color language rather than generic fire clip art. -->
  <path fill="url(#ramp)" transform="translate(256 256) scale(1.09) translate(-256 -256)" d="
    M 300 92
    C 270 132 236 168 218 212
    C 200 254 192 300 196 330
    C 200 360 210 386 226 404
    C 234 413 243 418 253 419
    C 263 418 271 412 277 405
    C 293 393 303 376 309 352
    C 315 326 315 298 307 272
    C 299 246 288 228 285 205
    C 282 182 288 124 300 92
    Z"/>
</svg>
