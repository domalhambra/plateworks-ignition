# Netlify configuration for ignition.plateworks.org (the plateworks-ignition
# site). The legacy badwater-ignition Netlify site is deleted; the old
# *.badwater.guide hosts 301 here via a Cloudflare redirect rule in the
# badwater.guide zone (see CLAUDE.md, Deploy & hosting).
#
# The site is fully static (a single self-contained page + PWA assets) — there is
# no build step. When connecting this repo to Netlify, set the site's
# "Base directory" to  web/  so this file and `publish = "."` resolve to this
# folder. (Dragging-and-dropping the web/ folder onto Netlify works too.)

[build]
  publish = "."

# obs.plateworks.org is a domain alias on this site so this 301 fires, sending
# old muscle memory to the canonical ignition.plateworks.org. (obs is the
# app's retired name; the alias exists to redirect, never to serve.)
[[redirects]]
  from = "https://obs.plateworks.org/*"
  to = "https://ignition.plateworks.org/:splat"
  status = 301
  force = true

# Security + privacy headers. Every calculation (IRPG tables, psychrometrics,
# .xlsx export) still runs locally in-page — no observation data ever leaves the
# device. The one outbound host is Plausible analytics, added 2026-07-28:
# cookieless, no personal data, no cross-site tracking. It carries page views
# and — since web/analytics.js — named interaction events (which control was
# used, never what was entered). It is allowed explicitly in script-src (to load
# the script) and connect-src (for its event beacon). Without BOTH, the CSP
# blocks it silently and the tag looks installed but reports nothing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://plausible.io; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"

# Always revalidate the entry point and the service worker so updates ship fast.
# Netlify matches these rules on the request path, so "/" needs its own rule —
# "/index.html" alone left the root (the URL everyone actually visits) on the
# platform default.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/engine.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/analytics.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# The icon URLs are NOT content-addressed — the rebrand changed icon.svg's
# bytes under the same path — so `immutable` (with the service worker
# precaching through the HTTP cache) could pin a year-old icon on installed
# devices. A week of caching keeps them cheap; the SW additionally precaches
# with {cache:"reload"} so a new CACHE version always refetches.
[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
